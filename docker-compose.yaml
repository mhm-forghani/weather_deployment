name: weather-api
networks:
  default:
    name: weather-api_default
services:
  app:
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
        required: true
      migrate:
        condition: service_completed_successfully
        required: true
      redis:
        condition: service_healthy
        required: true
    env_file:
      - path: .env.prod
        required: true
    image: ghcr.io/mhm-forghani/weather-api:latest
    networks:
      default: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "8000"
        target: 8000
    restart: unless-stopped
  beat:
    command:
      - uv
      - run
      - celery
      - -A
      - app.celery_app
      - beat
      - --loglevel=info
    depends_on:
      migrate:
        condition: service_completed_successfully
        required: true
      redis:
        condition: service_healthy
        required: true
    env_file:
      - path: .env.prod
        required: true
    image: ghcr.io/mhm-forghani/weather-api:latest
    networks:
      default: null
    restart: unless-stopped
  db:
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
    healthcheck:
      interval: 5s
      retries: 5
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USER} -d ${DB_NAME}
      timeout: 5s
    image: postgres:16
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - source: postgres_data
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
  migrate:
    command:
      - uv
      - run
      - alembic
      - upgrade
      - head
    depends_on:
      db:
        condition: service_healthy
        required: true
    env_file:
      - path: .env.prod
        required: true
    image: ghcr.io/mhm-forghani/weather-api:latest
    networks:
      default: null
    restart: "no"
  redis:
    healthcheck:
      interval: 5s
      retries: 5
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 5s
    image: redis:7
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - source: redis_data
        target: /data
        type: volume
        volume: {}
  worker-email:
    command:
      - uv
      - run
      - celery
      - -A
      - app.celery_app
      - worker
      - --concurrency=4
      - --loglevel=info
      - -Q
      - email_queue
    depends_on:
      db:
        condition: service_healthy
        required: true
      migrate:
        condition: service_completed_successfully
        required: true
      redis:
        condition: service_healthy
        required: true
    env_file:
      - path: .env.prod
        required: true
    image: ghcr.io/mhm-forghani/weather-api:latest
    networks:
      default: null
    restart: unless-stopped
  worker-report:
    command:
      - uv
      - run
      - celery
      - -A
      - app.celery_app
      - worker
      - --loglevel=info
      - -Q
      - report_queue
      - --concurrency=4
    depends_on:
      db:
        condition: service_healthy
        required: true
      migrate:
        condition: service_completed_successfully
        required: true
      redis:
        condition: service_healthy
        required: true
    env_file:
      - path: .env.prod
        required: true
    image: ghcr.io/mhm-forghani/weather-api:latest
    networks:
      default: null
    restart: unless-stopped
  worker-weather:
    command:
      - uv
      - run
      - celery
      - -A
      - app.celery_app
      - worker
      - --concurrency=4
      - -Q
      - celery
    depends_on:
      db:
        condition: service_healthy
        required: true
      migrate:
        condition: service_completed_successfully
        required: true
      redis:
        condition: service_healthy
        required: true
    env_file:
      - path: .env.prod
        required: true
    image: ghcr.io/mhm-forghani/weather-api:latest
    networks:
      default: null
    restart: unless-stopped
volumes:
  postgres_data:
    name: weather-api_postgres_data
  redis_data:
    name: weather-api_redis_data
x-app-env:
  env_file:
    - .env.prod
